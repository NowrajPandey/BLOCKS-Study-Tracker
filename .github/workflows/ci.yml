name: CI

on:
  push:
    branches: [main, replit-agent]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @workspace/blocks-study-tracker run typecheck

      - name: Test
        run: pnpm --filter @workspace/blocks-study-tracker run test

      - name: Build
        run: pnpm --filter @workspace/blocks-study-tracker run build
        env:
          BASE_PATH: /
